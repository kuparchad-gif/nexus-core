name: 🌀 Deploy NEXUS v6.0

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm install -g wrangler
      
      - name: Set up secrets
        run: |
          echo "$GITHUB_TOKEN" | wrangler secret put GITHUB_TOKEN
          echo "$CLOUDFLARE_API_TOKEN" | wrangler secret put CLOUDFLARE_API_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV="${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
          wrangler deploy --env "$ENV"
      
      - name: Verify Deployment
        run: |
          ENV="${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
          curl -sf "https://nexus-universal.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/health"
